name: Adapter tests
on:
  push:
  pull_request:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      core_ref:
        description: MEDRE revision (defaults to MEDRE_CORE_REF variable or main)
        type: string
      sdk_ref:
        description: Full commit SHA from jeremiah-k/mindroom-nio (SDK jobs only)
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        mode: [fake, sdk]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeremiah-k/medre
          ref: ${{ inputs.core_ref || vars.MEDRE_CORE_REF || 'main' }}
          path: .core
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: .core/.tool-versions
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: |
            .core/uv.lock
            pyproject.toml
      - name: Record baseline revision pair
        shell: bash
        run: |
          core_sha=$(git -C .core rev-parse HEAD)
          adapter_sha=$(git rev-parse HEAD)
          echo "Core baseline: ${core_sha}; adapter: ${adapter_sha}"
          echo "Core baseline: ${core_sha}; adapter: ${adapter_sha}" >> "$GITHUB_STEP_SUMMARY"
          echo "The pinned compatibility pair is qualified by MEDRE core CI." >> "$GITHUB_STEP_SUMMARY"
      - name: Check Python quality and whitespace
        if: matrix.mode == 'fake' && matrix.python == '3.13'
        run: |
          uvx --from ruff==0.16.9 ruff check src tests
          uvx --from black==26.5.1 black --check src tests
          git show --format= --check HEAD
      - name: Install core test environment
        run: uv sync --project .core --locked --extra dev
      - name: Verify selected core supports native typing
        run: |
          .core/.venv/bin/python -c "from medre.core.contracts.typing import TypingActivity, TypingSnapshot, TypingUpdate; from medre.core.contracts.adapter import AdapterCapabilities; assert AdapterCapabilities().typing is False"
      - name: Install this adapter without native SDKs
        if: matrix.mode == 'fake'
        run: uv pip install --python .core/.venv/bin/python --no-deps -e .
      - name: Install this adapter and its own SDK dependencies
        if: matrix.mode == 'sdk'
        run: .core/.venv/bin/python .core/scripts/ci/install_checkout_adapter.py --adapter . --test --python .core/.venv/bin/python
      - name: Validate candidate SDK revision
        if: matrix.mode == 'sdk' && inputs.sdk_ref != ''
        shell: bash
        env:
          SDK_REF: ${{ inputs.sdk_ref }}
        run: '[[ "$SDK_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "sdk_ref must be a full commit SHA"; exit 1; }'
      - name: Checkout candidate Matrix SDK
        if: matrix.mode == 'sdk' && inputs.sdk_ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeremiah-k/mindroom-nio
          ref: ${{ inputs.sdk_ref }}
          path: .sdk
          persist-credentials: false
      - name: Install candidate SDK within locked core constraints
        if: matrix.mode == 'sdk' && inputs.sdk_ref != ''
        shell: bash
        run: |
          uv export --project .core --locked --extra dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/sdk-core-constraints.txt"
          uv pip install --python .core/.venv/bin/python --constraint "$RUNNER_TEMP/sdk-core-constraints.txt" './.sdk[e2e]'
          uv pip check --python .core/.venv/bin/python
          .core/.venv/bin/python - <<'PYCODE'
          import json
          from importlib.metadata import distribution
          from pathlib import Path
          source = json.loads(distribution("mindroom-nio").read_text("direct_url.json") or "{}")
          assert source.get("url") == Path(".sdk").resolve().as_uri(), source
          PYCODE
          sdk_sha=$(git -C .sdk rev-parse HEAD)
          echo "Candidate SDK: ${sdk_sha}" >> "$GITHUB_STEP_SUMMARY"
      - name: Run deterministic tests
        if: matrix.mode == 'fake'
        run: .core/.venv/bin/python -m pytest -q -ra
      - name: Run native SDK contracts
        if: matrix.mode == 'sdk'
        run: .core/.venv/bin/python -m pytest -v -m "matrix_sdk and not local_integration and not soak and not live and not hardware and not docker"

  windows-e2ee-contract:
    # mindroom-nio 1.1.5 requires POSIX file leases. Restore this lane when
    # Windows ownership support is released; crypto import is insufficient.
    if: ${{ false }}
    name: Windows Matrix E2EE SDK (py3.13)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeremiah-k/medre
          ref: ${{ inputs.core_ref || vars.MEDRE_CORE_REF || 'main' }}
          path: .core
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: .core/.tool-versions
          python-version: "3.13"
          enable-cache: true
      - name: Record Windows baseline revision pair
        shell: bash
        run: |
          core_sha=$(git -C .core rev-parse HEAD)
          adapter_sha=$(git rev-parse HEAD)
          echo "Core baseline: ${core_sha}; adapter: ${adapter_sha}"
          echo "Core baseline: ${core_sha}; adapter: ${adapter_sha}" >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned core and Matrix with native encryption
        run: |
          uv sync --project .core --locked --extra dev
          .core/.venv/Scripts/python.exe .core/scripts/ci/install_checkout_adapter.py --adapter . --test --python .core/.venv/Scripts/python.exe
      - name: Verify selected core supports native typing
        run: |
          .core/.venv/Scripts/python.exe -c "from medre.core.contracts.typing import TypingActivity, TypingSnapshot, TypingUpdate; from medre.core.contracts.adapter import AdapterCapabilities; assert AdapterCapabilities().typing is False"
      - name: Prove installed cryptography is enabled, not merely importable
        run: |
          .core/.venv/Scripts/python.exe -c "from nio.crypto import ENCRYPTION_ENABLED; assert ENCRYPTION_ENABLED, 'mindroom-nio E2EE is disabled on Windows'"
      - name: Validate real cross-signing and crypto-store contracts without a homeserver
        run: |
          .core/.venv/Scripts/python.exe -m pytest -q -o addopts= tests/test_matrix_cross_signing_sdk_contract.py tests/test_matrix_store_lifecycle_sdk.py tests/test_matrix_decrypted_event_sdk_contract.py
